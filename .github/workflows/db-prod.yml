name: DB (prod)

# Maintenance against the production database (ADR-019). Runs here rather than
# on the developer's machine, whose network blocks outbound TCP 5432.
#
# Secrets: DATABASE_URL_PROD (Supabase session pooler URL), DATABASE_CA_CERT_PROD
# (Supabase root CA, PEM), NEON_DATABASE_URL (only for the one-off copy).
on:
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        type: choice
        options:
          - migrate
          - copy-from-neon
          - backfill:seniority
          - backfill:contacts
          - cleanup:junk
      dry_run:
        description: Dry run (backfill:seniority, cleanup:junk)
        type: boolean
        default: true

concurrency:
  group: db-prod # never two writers against prod at once

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL_PROD: ${{ secrets.DATABASE_URL_PROD }}
      DATABASE_CA_CERT_PROD: ${{ secrets.DATABASE_CA_CERT_PROD }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check secrets
        run: |
          if [ -z "$DATABASE_URL_PROD" ]; then
            echo "::error::DATABASE_URL_PROD secret is not set"; exit 1
          fi

      - name: Migrate + seed sources
        if: inputs.task == 'migrate'
        run: pnpm --filter @jobradar/api db:migrate:prod

      # pg_dump must be at least the source server's version (Neon runs 18).
      - name: Install PostgreSQL 18 client
        if: inputs.task == 'copy-from-neon'
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Copy all rows from Neon
        if: inputs.task == 'copy-from-neon'
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_CA_CERT_PROD" ]; then
            printf '%s\n' "$DATABASE_CA_CERT_PROD" > "$RUNNER_TEMP/prod-ca.crt"
            export PGSSLROOTCERT="$RUNNER_TEMP/prod-ca.crt"
          fi
          pnpm --filter @jobradar/api db:migrate:prod --no-seed
          cd apps/api && ./scripts/copy-from-neon.sh

      - name: Run maintenance script
        if: startsWith(inputs.task, 'backfill:') || inputs.task == 'cleanup:junk'
        env:
          TASK: ${{ inputs.task }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args="--prod"
          if [ "$DRY_RUN" = "true" ] && [ "$TASK" != "backfill:contacts" ]; then args="$args --dry-run"; fi
          pnpm --filter @jobradar/api "$TASK" $args
