# Local development infrastructure: Postgres (see docs/ARCHITECTURE.md; no Redis since ADR-031).
# Usage: docker compose up -d && docker compose ps
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobradar
      POSTGRES_PASSWORD: jobradar
      POSTGRES_DB: jobradar
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jobradar -d jobradar']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
